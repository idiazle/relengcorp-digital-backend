  /api/reports:
    get:
      operationId: list_reports
      description: Obtiene la lista de reportes de mantenimiento no eliminados con
        múltiples filtros disponibles.
      summary: Listar reportes
      parameters:
      - in: query
        name: condition
        schema:
          type: string
        description: Condición del equipo
      - in: query
        name: entity
        schema:
          type: integer
        description: ID de la entidad (equipo)
      - in: query
        name: execution_status
        schema:
          type: string
        description: Estado de ejecución
      - in: query
        name: is_active
        schema:
          type: boolean
        description: Si es el reporte activo del equipo
      - in: query
        name: ordering
        schema:
          type: string
          default: -created_at
        description: 'Campo para ordenar (ej: -execution_date)'
      - in: query
        name: page
        schema:
          type: integer
        description: Número de página
      - in: query
        name: page_size
        schema:
          type: integer
        description: 'Elementos por página (max: 100)'
      - in: query
        name: program
        schema:
          type: string
        description: Programa de mantenimiento
      - in: query
        name: search
        schema:
          type: string
        description: Buscar en name, observations, diagnostic, recomendations
      - in: query
        name: service_type
        schema:
          type: string
        description: Tipo de servicio
      - in: query
        name: work_type
        schema:
          type: string
        description: Tipo de trabajo
      tags:
