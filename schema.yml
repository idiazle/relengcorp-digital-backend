        description: Estado de la orden de trabajo
      - in: query
        name: page
        schema:
          type: integer
        description: Número de página
      - in: query
        name: page_size
        schema:
          type: integer
        description: 'Elementos por página (max: 100)'
      - in: query
        name: report
        schema:
          type: integer
        description: ID del reporte
      - in: query
        name: search
        schema:
          type: string
        description: Buscar en name, ot_number, comment
      - in: query
        name: status
        schema:
          type: string
        description: Estado del aviso
      - in: query
        name: status_real
        schema:
          type: string
        description: Estado real
      tags:
      - Notices
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNoticeList'
          description: ''
    post:
      operationId: create_notice
      description: Crea un nuevo aviso u orden de trabajo con soporte para múltiples
        imágenes.
      summary: Crear aviso
