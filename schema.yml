openapi: 3.0.3
info:
  title: RelengCorp Digital API
  version: 1.0.0
  description: API para gestión de mantenimiento predictivo y reportes de equipos
    industriales
  contact:
    name: RelengCorp Digital
    email: soporte@relengcorp.com
  license:
    name: Propietario
paths:
  /api/entities:
    get:
      operationId: list_entities
      description: Obtiene la lista de entidades no eliminadas. Las entidades son
        jerárquicas (plantas, áreas, rutas, equipos, items, componentes).
      summary: Listar entidades
      parameters:
      - in: query
        name: ordering
        schema:
          type: string
          default: -created_at
        description: 'Campo para ordenar (ej: name, -created_at)'
      - in: query
        name: page
        schema:
          type: integer
        description: Número de página
      - in: query
        name: page_size
        schema:
          type: integer
        description: 'Elementos por página (max: 100)'
      - in: query
        name: parent
        schema:
          type: string
        description: ID del padre o "null" para entidades raíz
      - in: query
        name: search
        schema:
          type: string
        description: Buscar en name o tag
      - in: query
        name: type
        schema:
          type: integer
        description: Tipo de entidad (1=Planta, 2=Área, 3=Ruta, 4=Equipo, 5=Item,
          6=Componente)
      tags:
      - Entities
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEntityList'
          description: ''
    post:
      operationId: create_entity
      description: Crea una nueva entidad (planta, área, ruta, equipo, item o componente).
        Puede ser jerárquica especificando un parent.
      summary: Crear entidad
      tags:
      - Entities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EntityRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EntityRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
          description: ''
        '400':
          description: No response body
    put:
      operationId: update_entity
      description: Actualiza parcial o totalmente una entidad existente.
      summary: Actualizar entidad
      tags:
      - Entities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EntityRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EntityRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
          description: ''
        '400':
          description: No response body
        '404':
          description: No response body
    delete:
      operationId: delete_entity
      description: Marca una entidad como eliminada sin eliminarla físicamente.
      summary: Eliminar entidad (soft delete)
      tags:
      - Entities
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
        '404':
          description: No response body
