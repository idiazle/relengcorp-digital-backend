          description: ''
        '400':
          description: No response body
        '404':
          description: No response body
    delete:
      operationId: delete_report
      description: Marca un reporte como eliminado sin eliminarlo físicamente. No
        elimina el archivo adjunto.
      summary: Eliminar reporte (soft delete)
      tags:
      - Reports
      security:
