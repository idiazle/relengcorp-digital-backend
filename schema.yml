      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReportList'
          description: ''
    post:
      operationId: create_report
      description: Crea un nuevo reporte de mantenimiento. Si is_active=true, desactiva
        otros reportes del mismo equipo automáticamente.
      summary: Crear reporte
      tags:
      - Reports
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
          application/x-www-form-urlencoded:
