  /api/equipments/conditions-by-month:
    get:
      operationId: equipment_condition_by_month
      description: Obtiene el conteo de equipos por condición (C1-C4) para cada uno
        de los últimos 7 meses.
      summary: Condiciones de equipos por mes
      tags:
      - Analytics
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                description: Mapa de meses con conteo de condiciones
                additionalProperties:
                  type: object
                  properties:
                    c1:
                      type: integer
                    c2:
                      type: integer
                    c3:
                      type: integer
                    c4:
                      type: integer
          description: ''
  /api/groups:
    get:
      operationId: list_groups
      description: Obtiene la lista de grupos (roles) disponibles para asignar a usuarios.
      summary: Listar grupos disponibles
